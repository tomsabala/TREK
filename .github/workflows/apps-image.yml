name: Publish apps-mount image

# Builds the fork's apps-gateway image: the client bundle compiled for the
# /a/trek mount prefix, pushed to this fork's own GHCR namespace. The two
# upstream workflows cannot be reused — both are workflow_dispatch-only, both
# gated on `github.repository == 'liketrek/TREK'`, and both push to Docker Hub
# with upstream secrets.

on:
  push:
    branches: [apps-mount]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'Dockerfile'
      - '.github/workflows/apps-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: apps-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trek
  BASE_PATH: /a/trek

jobs:
  publish:
    if: github.repository == 'tomsabala/TREK'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # amd64 only: the gateway VPS is x86, and arm64 under QEMU triples a
          # build that already carries Qt and a native better-sqlite3.
          platforms: linux/amd64
          build-args: |
            TREK_BASE_PATH=${{ env.BASE_PATH }}
            APP_VERSION=apps-mount-${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:apps-mount
            ${{ env.IMAGE }}:apps-mount-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:apps-mount-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:apps-mount-buildcache,mode=max
